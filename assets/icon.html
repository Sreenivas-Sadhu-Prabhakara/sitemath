<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #24272A; }
  body { display: grid; place-items: center; }
  /* 12% safe padding each side — mark fills the middle 76vmin */
  .mark { width: 100vmin; height: 100vmin; display: block; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
    <rect x="0" y="0" width="48" height="48" fill="#24272A"/>
    <g transform="rotate(-18 24 24)">
      <rect x="4" y="18.5" width="37" height="11" rx="1.5" fill="#F7C600"/>
      <rect x="38.5" y="15.5" width="4" height="17" rx="1" fill="#1B1D1E"/>
      <rect x="10" y="18.5" width="2" height="6" fill="#1B1D1E"/>
      <rect x="19" y="18.5" width="2" height="8" fill="#1B1D1E"/>
      <rect x="28" y="18.5" width="2" height="6" fill="#1B1D1E"/>
    </g>
  </svg>
</body>
</html>
