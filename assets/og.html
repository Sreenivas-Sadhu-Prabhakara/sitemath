<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ground: #E9EAE6;
    --ink: #1B1D1E;
    --muted: #5C6266;
    --tape: #F7C600;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(27,29,30,0.06), transparent 60%),
      var(--ground);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  /* faint concrete form-tie dots */
  .ties { position: absolute; inset: 0; opacity: .45; }
  .ties circle { fill: #C9CCC5; }

  .frame {
    position: absolute; inset: 0;
    padding: 78px 90px 70px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .wordmark { font-size: 58px; font-weight: 800; letter-spacing: -0.03em; }
  .headline { max-width: 980px; }
  .headline h1 {
    font-size: 62px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08;
  }
  .headline p {
    margin-top: 20px;
    font-size: 29px; color: var(--muted); font-weight: 500;
    max-width: 40ch; line-height: 1.35;
  }
  .headline .hl { background: var(--tape); padding: 0 10px; border-radius: 6px; }

  /* THE tape blade with hook, running across the concrete field */
  .tapewrap { position: relative; height: 74px; }
  .tape {
    position: absolute; left: 0; right: 34px; top: 12px; height: 50px;
    background: var(--tape);
    border-radius: 4px;
    box-shadow: 0 14px 34px -18px rgba(27,29,30,.55);
  }
  .tape .ticks { position: absolute; inset: 0; }
  .hook {
    position: absolute; right: 8px; top: 0; width: 20px; height: 74px;
    background: var(--ink); border-radius: 3px;
  }
  .stamp {
    position: absolute; left: 36px; top: 22px;
    font-size: 30px; font-weight: 800; letter-spacing: .02em;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .chips { display: flex; gap: 14px; margin-top: 26px; }
  .chip {
    font-size: 22px; font-weight: 600; color: var(--muted);
    border: 2px solid #C9CCC5; border-radius: 999px;
    padding: 9px 20px; background: rgba(245,246,242,.75);
  }
</style>
</head>
<body>
  <svg class="ties" viewBox="0 0 1200 630" aria-hidden="true">
    <circle cx="80" cy="90" r="7"/><circle cx="1120" cy="90" r="7"/>
    <circle cx="80" cy="540" r="7"/><circle cx="1120" cy="540" r="7"/>
  </svg>

  <div class="frame">
    <div class="brand">
      <svg width="72" height="72" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="1" y="1" width="46" height="46" rx="10" fill="#1B1D1E"/>
        <g transform="rotate(-18 24 24)">
          <rect x="2" y="19" width="40" height="11" rx="1.5" fill="#F7C600"/>
          <rect x="40" y="16" width="4" height="17" rx="1" fill="#1B1D1E"/>
          <rect x="9" y="19" width="2" height="6" fill="#1B1D1E"/>
          <rect x="19" y="19" width="2" height="8" fill="#1B1D1E"/>
          <rect x="29" y="19" width="2" height="6" fill="#1B1D1E"/>
        </g>
      </svg>
      <span class="wordmark">sitemath</span>
    </div>

    <div class="headline">
      <h1>Measure the room,<br>get the <span class="hl">shopping list</span>.</h1>
      <p>Paint, primer, putty &amp; tiles in real pack sizes — every coverage number cited, and yours to override.</p>
    </div>

    <div>
      <div class="tapewrap">
        <div class="tape">
          <svg class="ticks" viewBox="0 0 1076 50" preserveAspectRatio="none" aria-hidden="true">
            <g fill="#1B1D1E">
              <rect x="40" y="0" width="5" height="22"/><rect x="120" y="0" width="4" height="13"/>
              <rect x="200" y="0" width="4" height="13"/><rect x="280" y="0" width="5" height="22"/>
              <rect x="360" y="0" width="4" height="13"/><rect x="440" y="0" width="4" height="13"/>
              <rect x="520" y="0" width="5" height="22"/><rect x="600" y="0" width="4" height="13"/>
              <rect x="680" y="0" width="4" height="13"/><rect x="760" y="0" width="5" height="22"/>
              <rect x="840" y="0" width="4" height="13"/><rect x="920" y="0" width="4" height="13"/>
              <rect x="1000" y="0" width="5" height="22"/>
            </g>
          </svg>
          <span class="stamp">2 × (L + W) × H − openings</span>
        </div>
        <div class="hook"></div>
      </div>
      <div class="chips">
        <span class="chip">Cited TDS coverage bands</span>
        <span class="chip">Real tins · bags · boxes</span>
        <span class="chip">100% offline — CSP-enforced</span>
      </div>
    </div>
  </div>
</body>
</html>
